name: Trigger Kaggle Render

on:
  repository_dispatch:
    types: [run-kaggle]

jobs:
  run-kaggle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Configure Credentials & Clear Old Session
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          # 1. Cấu hình Authen
          mkdir -p ~/.kaggle
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          
          # 2. Ép hủy/dọn dẹp phiên kẹt cũ trên Kaggle (nếu có)
          echo "--> Đang kiểm tra và hủy các tiến trình Kaggle cũ..."
          kaggle kernels output $KAGGLE_USERNAME/ltx-video-render || true

      - name: Push New Code to Kaggle
        run: |
          # 3. Đẩy code mới lên thực thi
          kaggle kernels push -p .
