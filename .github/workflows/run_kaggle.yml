name: Trigger Kaggle Render

on:
  repository_dispatch:
    types: [run-kaggle]
  workflow_dispatch:
    inputs:
      drive_folder_id:
        description: "Google Drive folder ID (folder ngày)"
        required: false
        default: ""

jobs:
  run-kaggle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Kaggle CLI
        run: pip install --upgrade kaggle

      - name: Resolve drive_folder_id
        id: folder
        run: |
          # Ưu tiên payload từ n8n (repository_dispatch)
          FOLDER="${{ github.event.client_payload.drive_folder_id }}"
          # Fallback: input khi bấm tay (workflow_dispatch)
          if [ -z "$FOLDER" ]; then
            FOLDER="${{ github.event.inputs.drive_folder_id }}"
          fi
          if [ -z "$FOLDER" ]; then
            echo "⚠️ Không có drive_folder_id"
            FOLDER=""
          fi
          echo "drive_folder_id=$FOLDER" >> $GITHUB_OUTPUT
          echo "📁 drive_folder_id=$FOLDER"

      - name: Setup Kaggle + write config
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          DRIVE_FOLDER_ID: ${{ steps.folder.outputs.drive_folder_id }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

          # runtime_config.json cho render_script.py
          python - <<'PY'
          import json, os
          cfg = {
              "drive_folder_id": os.environ.get("DRIVE_FOLDER_ID", "").strip(),
              "source": "github_actions",
          }
          with open("runtime_config.json", "w", encoding="utf-8") as f:
              json.dump(cfg, f, indent=2, ensure_ascii=False)
          print("runtime_config.json:", cfg)
          PY

          # Cập nhật kernel-metadata.json
          python - <<'PY'
          import json, os
          username = os.environ["KAGGLE_USERNAME"]
          slug = "ltx-video-render"
          with open("kernel-metadata.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          data["id"] = f"{username}/{slug}"
          data["title"] = "LTX Video Render"
          data["language"] = "python"
          data["kernel_type"] = "script"
          data["is_private"] = True
          data["enable_gpu"] = True
          data["enable_internet"] = True
          data["enable_tpu"] = False
          code = data.get("code_file", "render_script.py")
          data["code_file"] = os.path.basename(code)
          if "model_sources" not in data:
              data["model_sources"] = []
          with open("kernel-metadata.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
          print("kernel-metadata.json updated")
          PY

      - name: Inject runtime_config reader into render_script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("render_script.py")
          if not p.exists():
              raise SystemExit("Thiếu render_script.py")
          text = p.read_text(encoding="utf-8")
          marker = "# --- runtime_config inject ---"
          inject = '''# --- runtime_config inject ---
          import json as _json, os as _os
          try:
              with open("runtime_config.json", "r", encoding="utf-8") as _f:
                  _cfg = _json.load(_f)
              if _cfg.get("drive_folder_id"):
                  _os.environ["DRIVE_FOLDER_ID"] = str(_cfg["drive_folder_id"])
                  print("📁 DRIVE_FOLDER_ID from runtime_config:", _os.environ["DRIVE_FOLDER_ID"])
          except Exception as _e:
              print("⚠️ runtime_config:", _e)
          # --- end inject ---
          '''
          if marker not in text:
              p.write_text(inject + "\n" + text, encoding="utf-8")
              print("✅ Đã inject runtime_config")
          else:
              print("Đã có inject, bỏ qua")
          PY

      - name: Push kernel to Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          echo "=== kernel-metadata.json ==="
          cat kernel-metadata.json
          echo "=== runtime_config.json ==="
          cat runtime_config.json
          kaggle kernels push -p .
          echo "✅ Push xong"

      - name: Summary
        if: always()
        run: |
          echo "Kernel: ${{ secrets.KAGGLE_USERNAME }}/ltx-video-render"
          echo "Folder: ${{ steps.folder.outputs.drive_folder_id }}"
          echo "Lưu ý: kaggle kernels push chỉ cập nhật code. Cần Run All (GPU) trên Kaggle nếu không tự chạy."
