name: Trigger Kaggle Render

on:
  repository_dispatch:
    types: [run-kaggle]

jobs:
  run-kaggle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Kaggle CLI
        run: pip install --upgrade kaggle

      - name: Configure Credentials & Generate Dynamic Slug
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          # 1. Tạo thư mục và ghi file xác thực Kaggle API đơn giản
          mkdir -p ~/.kaggle
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

          # 2. Tạo TIMESTAMP & Dynamic Slug
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          DYNAMIC_SLUG="wan-render-$TIMESTAMP"
          
          echo "--> Generating new notebook ID: $KAGGLE_USERNAME/$DYNAMIC_SLUG"
          
          # 3. Ghi đè thông số ID, Title và kiểm tra code_file trong kernel-metadata.json
          python -c "
          import json, os

          username = os.environ['KAGGLE_USERNAME']
          slug = '$DYNAMIC_SLUG'
          timestamp = '$TIMESTAMP'

          with open('kernel-metadata.json', 'r') as f:
              data = json.load(f)

          data['id'] = f'{username}/{slug}'
          data['title'] = f'LTX Render {timestamp}'
          
          # Đảm bảo đường dẫn file script chính xác ở thư mục gốc
          if 'code_file' in data and '/' in data['code_file']:
              data['code_file'] = os.path.basename(data['code_file'])

          with open('kernel-metadata.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Push New Code to Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          kaggle kernels push -p .
