name: Trigger Kaggle Render

on:
  repository_dispatch:
    types: [run-kaggle]

jobs:
  run-kaggle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Kaggle & Requests
        run: pip install kaggle requests

      - name: Force Stop & Delete Active Session on Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

          python -c "
          import requests

          username = '$KAGGLE_USERNAME'
          key = '$KAGGLE_KEY'
          kernel_slug = 'ltx-video-render'

          # Gọi Internal API của Kaggle để hủy phiên đang chạy
          url = f'https://www.kaggle.com/api/v1/kernels/cancel'
          auth = (username, key)
          payload = {'kernelSlug': f'{username}/{kernel_slug}'}
          
          res = requests.post(url, auth=auth, json=payload)
          print(f'--> [Kaggle Cleanup] Trạng thái ngắt phiên cũ: {res.status_code}')
          " || true

          # Chờ 5 giây để Kaggle giải phóng GPU hoàn toàn
          sleep 5

      - name: Push New Code to Kaggle
        run: |
          kaggle kernels push -p .
