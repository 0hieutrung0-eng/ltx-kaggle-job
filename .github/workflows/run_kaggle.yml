name: Trigger Kaggle Render

on:
  repository_dispatch:
    types: [run-kaggle]

jobs:
  run-kaggle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Configure Credentials & Generate Daily Slug
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          
          # Tự động tạo slug kèm Ngày-Giờ-Phút hiện tại để không bao giờ bị đùng trùng ID
          TIMESTAMP=$(date +'%Y%m%d-%H%M')
          SLUG="ltx-render-$TIMESTAMP"
          
          # Cập nhật ID mới vào kernel-metadata.json
          echo "--> Tạo Notebook ID mới: $SLUG"
          sed -i "s/\"id\": \".*\"/\"id\": \"$KAGGLE_USERNAME\/$SLUG\"/g" kernel-metadata.json

      - name: Push New Code to Kaggle
        run: |
          kaggle kernels push -p .
