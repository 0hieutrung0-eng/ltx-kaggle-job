name: Trigger Kaggle Render

on:
  repository_dispatch:
    types: [run-kaggle]

jobs:
  run-kaggle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Configure Credentials & Generate Dynamic Slug
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          # 1. Tạo file xác thực Kaggle API
          mkdir -p ~/.kaggle
          python -c "
          import os, json
          creds = {
              'username': os.environ['KAGGLE_USERNAME'],
              'key': os.environ['KAGGLE_KEY']
          }
          with open('/os_home/.kaggle/kaggle.json'.replace('/os_home', os.path.expanduser('~')), 'w') as f:
              json.dump(creds, f)
          "
          chmod 600 ~/.kaggle/kaggle.json

          # 2. Tạo Slug mới theo Ngày-Giờ-Phút
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          DYNAMIC_SLUG="wan-render-$TIMESTAMP"
          
          echo "--> Generating new notebook ID: $KAGGLE_USERNAME/$DYNAMIC_SLUG"
          
          # 3. Ghi đè ID mới vào kernel-metadata.json
          python -c "
          import json, os
          username = os.environ['KAGGLE_USERNAME']
          timestamp = '$TIMESTAMP'
          slug = '$DYNAMIC_SLUG'
          
          with open('kernel-metadata.json', 'r') as f:
              data = json.load(f)
              
          data['id'] = f'{username}/{slug}'
          data['title'] = f'LTX Render {timestamp}'
          
          with open('kernel-metadata.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Push New Code to Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          kaggle kernels push -p .
